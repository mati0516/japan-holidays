name: 検査

on:
  push:
    branches: [main]
    paths: ["scripts/**", "data/**", ".github/workflows/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 手元のデータから作り直す
        run: python scripts/generate.py --offline
      - name: 全形式を検査する
        run: python scripts/validate.py
